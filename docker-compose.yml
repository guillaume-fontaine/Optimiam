services:
  postgres:
    image: postgres:16-alpine
    container_name: optimiam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: optimiam
      POSTGRES_USER: optimiam
      POSTGRES_PASSWORD: optimiam_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimiam -d optimiam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
